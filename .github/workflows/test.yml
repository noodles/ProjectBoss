name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS because pb shells out to `open` and `pbpaste`, and the installer
    # writes to ~/.zshrc. Testing on Linux would pass while proving nothing.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -v
      - name: Check the CLI starts
        run: python3 pb.py --version
